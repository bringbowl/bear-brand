name: Auto Sync Social Media Metrics

on:
  schedule:
    # Every Monday at 00:00 UTC (08:00 Taiwan Time CST)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows 1-click manual sync anytime from GitHub Actions tab

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Automated Metrics Sync
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python scripts/sync_metrics.py

      - name: Commit and Push Updated Media Kit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html scripts/metrics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto-sync): update weekly social metrics [skip ci]" && git push)
